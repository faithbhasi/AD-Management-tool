# ILM Portal: recommended PostgreSQL settings (merge into postgresql.conf). Values are examples.
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = 'server.crt'          # issued by the internal CA; clients use SSL Mode=VerifyFull
ssl_key_file = 'server.key'
password_encryption = 'scram-sha-256'
log_connections = on
log_disconnections = on
log_statement = 'ddl'                  # every schema change is logged
shared_preload_libraries = 'pgaudit'   # if available: pgaudit.log = 'ddl, role, write' for DBA sessions
# pg_hba.conf (example). Kerberos for both ILM identities, so no password exists in any ILM configuration
# (ILM refuses to start in production if a connection string contains one).
#   hostssl ilm ilm_app       10.20.0.0/24  gss include_realm=0 krb_realm=CORP.EXAMPLE.TEST map=ilm
#   hostssl ilm ilm_migrator  10.20.0.0/24  gss include_realm=0 krb_realm=CORP.EXAMPLE.TEST map=ilm
#   hostssl all +ilm_dba      10.30.0.0/24  gss include_realm=0 krb_realm=CORP.EXAMPLE.TEST map=dba
#   host    all all           0.0.0.0/0     reject
# pg_ident.conf (example):
#   ilm  svc-ilm$         ilm_app          # the ILM gMSA
#   ilm  adm-dbchange1    ilm_migrator     # named change implementers only, used during change windows
#   dba  adm-dba1         dba_alice        # named DBA logins that are members of ilm_dba
# If Kerberos is not available for ilm_migrator, use scram-sha-256 with the password in a pgpass file
# (Npgsql "Passfile=" or PGPASSFILE) on the change implementer's workstation, never in ILM configuration.
